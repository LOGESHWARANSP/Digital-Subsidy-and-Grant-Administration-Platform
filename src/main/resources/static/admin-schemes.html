<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Manage Schemes - Digital Subsidy</title>

    <link rel="stylesheet"
          href="css/style.css">

    <style>

        /* ================= HEADER ================= */

        .scheme-management-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }


        .add-scheme-btn {
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            background: #2563eb;
            color: white;
        }

        .add-scheme-btn:hover {
            background: #1d4ed8;
        }


        /* ================= FORM ================= */

        .scheme-form-card {
            background: white;
            padding: 28px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            margin-bottom: 25px;
            display: none;
        }

        .scheme-form-card h2 {
            margin-top: 0;
            margin-bottom: 25px;
        }


        .scheme-form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }


        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }


        .form-group label {
            font-size: 14px;
            font-weight: 600;
            color: #334155;
        }


        .form-group input,
        .form-group select,
        .form-group textarea {

            width: 100%;
            padding: 13px 14px;

            border: 1px solid #d1d5db;
            border-radius: 8px;

            font-size: 15px;
            font-family: inherit;

            background: #ffffff;

            box-sizing: border-box;

        }


        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {

            outline: none;
            border-color: #2563eb;

        }


        .form-group textarea {
            resize: vertical;
        }


        .full-width {
            grid-column: 1 / -1;
        }


        /* ================= FORM BUTTONS ================= */

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 5px;
        }


        .cancel-btn {

            padding: 12px 20px;

            border: 1px solid #d1d5db;
            border-radius: 8px;

            background: white;

            font-size: 14px;
            font-weight: 600;

            cursor: pointer;

        }


        .cancel-btn:hover {
            background: #f8fafc;
        }


        /* ================= TABLE ================= */

        .scheme-table-container {

            background: white;

            border: 1px solid #e5e7eb;
            border-radius: 12px;

            overflow-x: auto;

        }


        .scheme-table {

            width: 100%;
            border-collapse: collapse;

        }


        .scheme-table th,
        .scheme-table td {

            padding: 15px;
            text-align: left;

            border-bottom:
                    1px solid #e5e7eb;

        }


        .scheme-table th {

            font-size: 13px;
            color: #64748b;
            font-weight: 600;

        }


        .scheme-table td {
            font-size: 14px;
        }


        /* ================= STATUS ================= */

        .scheme-status {

            padding: 6px 12px;
            border-radius: 20px;

            font-size: 12px;
            font-weight: 600;

        }


        .scheme-status.active {

            background: #dcfce7;
            color: #166534;

        }


        .scheme-status.inactive {

            background: #fee2e2;
            color: #991b1b;

        }


        /* ================= ACTION BUTTONS ================= */

        .table-action-btn {

            border: none;

            padding: 8px 12px;
            border-radius: 6px;

            cursor: pointer;

            font-size: 13px;
            font-weight: 600;

            margin-right: 5px;

        }


        .edit-btn {

            background: #dbeafe;
            color: #1d4ed8;

        }


        .delete-btn {

            background: #fee2e2;
            color: #dc2626;

        }


        /* ================= MOBILE ================= */

        @media(max-width: 700px) {

            .scheme-management-header {

                flex-direction: column;
                align-items: flex-start;

            }


            .scheme-form-grid {

                grid-template-columns: 1fr;

            }


            .full-width {

                grid-column: auto;

            }

        }
        .scheme-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-btn {
            border: none;
            border-radius: 7px;
            padding: 8px 13px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .edit-scheme-btn {
            background: #eff6ff;
            color: #2563eb;
            border: 1px solid #bfdbfe;
        }

        .edit-scheme-btn:hover {
            background: #dbeafe;
        }

        .delete-scheme-btn {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }

        .delete-scheme-btn:hover {
            background: #fee2e2;
        }

    </style>

</head>


<body class="dashboard-page">


<!-- ================= NAVBAR ================= -->

<header class="navbar">

    <div class="logo">

        Digital<span>Subsidy</span>

    </div>


    <nav>

        <a href="admin-dashboard.html">

            Dashboard

        </a>


        <a href="admin-schemes.html"
           class="active">

            Schemes

        </a>


        <a href="admin-users.html">

            Users

        </a>
        <a href="admin-applications.html">

            Applications

        </a>
        <a href="admin-payments.html">Payments</a>
    </nav>


    <!-- PROFILE -->

    <div class="profile-menu">

        <button class="profile-button"
                id="profileButton">

            <span>
                👤
            </span>


            <span id="staffEmail">

                Admin

            </span>


            <span>
                ▼
            </span>

        </button>


        <div class="profile-dropdown"
             id="profileDropdown">


            <div class="dropdown-user">


                <div class="dropdown-avatar">

                    👤

                </div>


                <div>

                    <strong id="dropdownStaffEmail">

                        Admin

                    </strong>


                    <small>

                        Administrator

                    </small>

                </div>


            </div>


            <div class="dropdown-divider">

            </div>


            <button id="logoutBtn">

                🚪 Logout

            </button>


        </div>

    </div>

</header>



<!-- ================= MAIN ================= -->

<main class="profile-container">


    <!-- PAGE HEADER -->

    <div class="scheme-management-header">


        <div>


            <p class="hero-tag">

                ADMIN PORTAL

            </p>


            <h1>

                Manage Schemes

            </h1>


            <p>

                Create, edit and manage subsidy schemes.

            </p>


        </div>


        <button
                type="button"
                class="add-scheme-btn"
                id="showFormBtn">

            + Add Scheme

        </button>


    </div>



    <!-- ================= ADD / EDIT FORM ================= -->

    <div class="scheme-form-card"
         id="schemeFormCard">


        <h2 id="formTitle">

            Add New Scheme

        </h2>


        <!-- IMPORTANT: scheme-form-grid ADDED -->

        <form id="schemeForm"
              class="scheme-form-grid">
            <input
                    type="hidden"
                    id="status"
                    value="ACTIVE">


            <!-- SCHEME NAME -->

            <div class="form-group">

                <label for="schemeName">

                    Scheme Name

                </label>

                <input
                        type="text"
                        id="schemeName"
                        required>

            </div>



            <!-- MAX AMOUNT -->

            <div class="form-group">

                <label for="maximumAmount">

                    Maximum Subsidy Amount (₹)

                </label>

                <input
                        type="number"
                        id="maximumAmount"
                        min="0"
                        required>

            </div>



            <!-- MIN AGE -->

            <div class="form-group">

                <label for="minimumAge">

                    Minimum Age

                </label>

                <input
                        type="number"
                        id="minimumAge"
                        min="0"
                        required>

            </div>



            <!-- MAX AGE -->

            <div class="form-group">

                <label for="maximumAge">

                    Maximum Age

                </label>

                <input
                        type="number"
                        id="maximumAge"
                        min="0"
                        required>

            </div>



            <!-- MAX INCOME -->

            <div class="form-group">

                <label for="maximumIncome">

                    Maximum Annual Income (₹)

                </label>

                <input
                        type="number"
                        id="maximumIncome"
                        min="0"
                        required>

            </div>



            <!-- OCCUPATION -->

            <div class="form-group">

                <label for="eligibleOccupation">
                    Occupation
                </label>

                <select id="eligibleOccupation" required>
                    <option value="">Select occupation</option>
                    <option value="Student">Student</option>
                    <option value="Employee">Employee</option>
                    <option value="Farmer">Farmer</option>
                    <option value="Entrepreneur">Entrepreneur</option>
                    <option value="Fisherman">Fisherman</option>
                    <option value="Worker">Worker</option>
                    <option value="Senior Citizen">Senior Citizen</option>
                </select>

            </div>

            <div class="form-group">

                <label>Eligible Gender</label>

                <select id="eligibleGender">

                    <option value="ALL">
                        All Genders
                    </option>

                    <option value="MALE">
                        Male
                    </option>

                    <option value="FEMALE">
                        Female
                    </option>

                    <option value="OTHER">
                        Other
                    </option>

                </select>

            </div>
            <!-- START DATE -->

            <div class="form-group">

                <label for="startDate">

                    Start Date

                </label>

                <input
                        type="date"
                        id="startDate"
                        required>

            </div>



            <!-- END DATE -->

            <div class="form-group">

                <label for="endDate">

                    End Date

                </label>

                <input
                        type="date"
                        id="endDate"
                        required>

            </div>


            <div class="form-group full-width">

                <label for="benefits">
                    Scheme Benefits
                </label>

                <textarea
                        id="benefits"
                        rows="5"
                        placeholder="Enter scheme benefits..."
                        required>
                </textarea>

            </div>
            <!-- DESCRIPTION -->

            <div class="form-group full-width">

                <label for="description">

                    Scheme Description

                </label>

                <textarea
                        id="description"
                        rows="4">

                </textarea>

            </div>



            <!-- REQUIRED DOCUMENTS -->

            <div class="form-group full-width">

                <label for="requiredDocuments">

                    Required Documents

                </label>

                <textarea
                        id="requiredDocuments"
                        rows="3"
                        placeholder="Example: Aadhaar Card, Income Certificate">

                </textarea>

            </div>



            <!-- BUTTONS -->

            <div class="full-width form-actions">


                <button
                        type="submit"
                        class="add-scheme-btn"
                        id="saveSchemeBtn">

                    Save Scheme

                </button>


                <!-- THIS ID FIXES YOUR NULL ERROR -->

                <button
                        type="button"
                        class="cancel-btn"
                        id="cancelFormBtn">

                    Cancel

                </button>


            </div>


        </form>

    </div>



    <!-- ================= SCHEME TABLE ================= -->

    <div class="scheme-table-container">


        <table class="scheme-table">


            <thead>


            <tr>

                <th>ID</th>

                <th>Scheme Name</th>

                <th>Amount</th>

                <th>Age Limit</th>

                <th>Status</th>

                <th>Actions</th>

            </tr>


            </thead>



            <tbody id="schemesTableBody">


            <tr>

                <td colspan="6">

                    Loading schemes...

                </td>

            </tr>


            </tbody>


        </table>


    </div>


</main>



<!-- ================= JAVASCRIPT ================= -->

<script src="js/admin-schemes.js"></script>

</body>

</html>
